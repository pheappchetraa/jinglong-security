<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <title>JingLong Security</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', isDark)
      })()
    </script>
  </head>
  <body class="flex min-h-screen flex-col bg-white text-gray-900 transition-colors dark:bg-gray-950 dark:text-gray-100">
    <header class="bg-white shadow-md transition-colors dark:bg-gray-900">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <a href="/" class="flex items-center gap-2">
          <img src="/src/assets/SJL Logo-01.png" alt="JingLong Security" class="h-10 w-10 object-contain" />
          <span class="text-xl font-bold text-blue-900 dark:text-white">JingLong Security</span>
        </a>

        <nav class="flex items-center gap-6">
          <a href="/" data-nav-link data-nav-exact class="font-medium transition-colors text-gray-600 hover:text-blue-900 dark:text-gray-300 dark:hover:text-white">ទំព័រដើម</a>
          <a href="/services" data-nav-link class="font-medium transition-colors text-gray-600 hover:text-blue-900 dark:text-gray-300 dark:hover:text-white">សេវាកម្ម</a>
          <a href="/about" data-nav-link class="font-medium transition-colors text-gray-600 hover:text-blue-900 dark:text-gray-300 dark:hover:text-white">អំពីយើង</a>
          <a href="/contact" data-nav-link class="font-medium transition-colors text-gray-600 hover:text-blue-900 dark:text-gray-300 dark:hover:text-white">ទំនាក់ទំនង</a>

          <button
            type="button"
            id="theme-toggle"
            aria-label="ប្តូររបៀបងងឹត/ភ្លឺ"
            class="flex h-9 w-9 items-center justify-center rounded-full text-gray-600 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
          >
            <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="hidden h-5 w-5">
              <path
                fill-rule="evenodd"
                d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"
                clip-rule="evenodd"
              />
            </svg>
            <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="hidden h-5 w-5">
              <path
                fill-rule="evenodd"
                d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="flex-1">
      <section id="hero-slider" class="relative h-100 w-full overflow-hidden sm:h-125 md:h-150">
        <div class="hero-slide absolute inset-0 bg-linear-to-br from-blue-950 via-blue-900 to-blue-800 opacity-100 transition-opacity duration-700 ease-in-out"></div>
        <div class="hero-slide absolute inset-0 bg-linear-to-br from-gray-900 via-gray-800 to-blue-950 opacity-0 transition-opacity duration-700 ease-in-out"></div>
        <div class="hero-slide absolute inset-0 bg-linear-to-br from-blue-900 via-slate-900 to-gray-900 opacity-0 transition-opacity duration-700 ease-in-out"></div>

        <button
          type="button"
          id="hero-prev"
          aria-label="មុន"
          class="absolute left-4 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-white/20 text-white backdrop-blur transition-colors hover:bg-white/30"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <button
          type="button"
          id="hero-next"
          aria-label="បន្ទាប់"
          class="absolute right-4 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-white/20 text-white backdrop-blur transition-colors hover:bg-white/30"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>

        <div id="hero-dots" class="absolute bottom-4 left-1/2 flex -translate-x-1/2 gap-2"></div>
      </section>
    </main>

    <footer class="border-t border-gray-200 bg-white transition-colors dark:border-gray-800 dark:bg-gray-900">
      <div class="mx-auto grid max-w-6xl grid-cols-1 gap-10 px-4 py-10 md:grid-cols-3">
        <div class="flex flex-col items-center gap-3 text-center">
          <img src="/src/assets/SJL Logo-01.png" alt="JingLong Security" class="h-16 w-16 object-contain" />
          <span class="text-lg font-bold text-blue-900 dark:text-white">JingLong Security</span>
          <p class="text-sm text-gray-600 dark:text-gray-400">សេវាកម្មសន្តិសុខសម្រាប់សហគមន៍</p>
        </div>

        <div class="flex flex-col items-center gap-4 text-center">
          <h3 class="text-lg font-bold text-blue-900 dark:text-white">ទំនាក់ទំនង</h3>

          <ul class="space-y-1 text-sm text-gray-600 dark:text-gray-400">
            <li>
              អីមែល៖
              <a id="footer-email-link" href="#" target="_blank" rel="noopener noreferrer" class="hover:text-blue-900 dark:hover:text-white">
                <span id="footer-email-text"></span>
              </a>
            </li>
            <li>
              លេខទូរស័ព្ទ៖
              <a id="footer-phone-link" href="#" target="_blank" rel="noopener noreferrer" class="hover:text-blue-900 dark:hover:text-white">
                <span id="footer-phone-text"></span>
              </a>
            </li>
            <li>អាស័យដ្ឋាន៖ ភ្នំពេញ, កម្ពុជា</li>
          </ul>

          <form id="contact-form" class="w-full max-w-sm space-y-3">
            <input
              type="email"
              name="email"
              placeholder="អីមែលរបស់អ្នក"
              required
              class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:border-blue-900 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            />
            <input
              type="tel"
              name="phone"
              placeholder="លេខទូរស័ព្ទរបស់អ្នក"
              required
              class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:border-blue-900 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            />
            <input
              type="text"
              name="address"
              placeholder="អាស័យដ្ឋានរបស់អ្នក"
              required
              class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:border-blue-900 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            />
            <button
              type="submit"
              class="w-full rounded-md bg-blue-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-blue-800"
            >
              ផ្ញើសំណើ
            </button>
          </form>
        </div>

        <div class="flex flex-col items-center justify-center gap-2 text-center md:items-end md:text-right">
          <img src="/src/assets/romdoullogo.png" alt="JingLong Security" class="h-16 w-16 object-contain" />
          <span class="text-sm text-gray-500 dark:text-gray-400">Design By Romdoul</span>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
